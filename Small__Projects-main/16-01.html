<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <style>
        /* --- CSS Section --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .dashboard {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; margin-bottom: 10px; opacity: 0.9; }

        #clock {
            font-size: 4rem;
            font-weight: 800;
            margin: 10px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }

        .todo-section {
            margin-top: 30px;
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
        }

        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        input::placeholder { color: #ddd; }

        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: #fff;
            color: #764ba2;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.05); background: #eee; }

        ul { list-style: none; }

        li {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .delete-btn {
            background: #ff5e5e;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1 id="greeting">Namaste!</h1>
        <div id="clock">00:00</div>
        <p id="date" style="margin-bottom: 20px; opacity: 0.8;"></p>

        <div class="todo-section">
            <h3 style="margin-bottom: 15px;">Aaj ke Kaam (To-Do)</h3>
            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="Naya kaam likhein...">
                <button onclick="addTodo()">Add</button>
            </div>
            <ul id="todoList"></ul>
        </div>
    </div>

    <script>
        /* --- JavaScript Section --- */

        // Clock aur Greeting Update karein
        function updateTime() {
            const now = new Date();
            
            // Time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;

            // Date
            const dateOptions = { day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('hi-IN', dateOptions);

            // Greeting
            const h = now.getHours();
            let greet = "Namaste!";
            if (h < 12) greet = "Shubh Prabhat! ☀️";
            else if (h < 17) greet = "Shubh Dopahar! 🌤️";
            else greet = "Shubh Sandhya! 🌙";
            document.getElementById('greeting').innerText = greet;
        }

        // To-Do Logic
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            
            if (text !== "") {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${text}</span>
                    <button class="delete-btn" onclick="this.parentElement.remove()">Khatam</button>
                `;
                document.getElementById('todoList').appendChild(li);
                input.value = "";
            }
        }

        // Enter key se bhi add ho jaye
        document.getElementById('todoInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addTodo();
        });

        // Har second update karein
        setInterval(updateTime, 1000);
        updateTime();
    </script>

</body>
</html>
