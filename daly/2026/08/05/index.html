<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f5f5f5;
}

.card{
    width:320px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card-content h2{
    margin-bottom:10px;
    color:#222;
}

.card-content p{
    color:#666;
    line-height:1.6;
    margin-bottom:15px;
}

.card-content a{
    display:inline-block;
    text-decoration:none;
    background:#007bff;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    transition:.3s;
}

.card-content a:hover{
    background:#0056b3;
}
</style>
</head>
<body>

<div class="card">
    <img src="https://picsum.photos/400/250" alt="Card Image">

    <div class="card-content">
        <h2>HTML Card</h2>
        <p>
            This is a simple responsive card built using HTML and CSS.
        </p>

        <a href="#">Read More</a>
    </div>
</div>

</body>
</html>
